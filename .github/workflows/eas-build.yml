name: EAS Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build Profile (preview for final app, development for expo go alternative)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - development
      arch:
        description: 'CPU Architecture (arm64-v8a is fastest, all builds a universal fat APK)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
          - all

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚙️ Configure Architecture
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const arch = '${{ github.event.inputs.arch || 'arm64-v8a' }}';
            const buildProps = app.expo.plugins.find(p => Array.isArray(p) && p[0] === 'expo-build-properties');
            if (buildProps) {
              if (arch === 'all') {
                delete buildProps[1].android.reactNativeArchitectures;
              } else {
                buildProps[1].android.reactNativeArchitectures = [arch];
              }
            }
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "

      - name: 🚀 Build locally on GitHub Actions (Bypasses Expo Limits)
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --local --non-interactive --output app.apk

      - name: 💾 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamBD-Player-APK
          path: app.apk
