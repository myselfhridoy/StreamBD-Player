name: EAS Build
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build locally on GitHub Actions (Bypasses Expo Limits)
        run: eas build --platform android --profile preview --local --non-interactive --output app.apk

      - name: 💾 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamBD-Player-APK
          path: app.apk
